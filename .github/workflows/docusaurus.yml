name: Deploy Docusaurus to gh-pages/docs (npm)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docusaurus.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docusaurus.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout main
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Установить Node.js с кэшем npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'   # теперь кэшируем npm

      # 3. Установить зависимости через npm
      - name: Install dependencies
        run: npm ci

      # 4. Собрать Docusaurus в build/
      - name: Build Docusaurus
        run: npm run build

      # 5. Checkout отдельно ветки gh-pages
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: 'gh-pages'
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: './gh-pages'

      # 6. Очистить старый docs/ в gh-pages и положить новый build
      - name: Copy build to gh-pages docs
        run: |
          rm -rf ./gh-pages/docs
          mkdir ./gh-pages/docs
          cp -r build/* ./gh-pages/docs/

      # 7. Коммит и пуш в gh-pages
      - name: Commit and push gh-pages/docs
        run: |
          cd ./gh-pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs
          git commit -m "Update docs from Docusaurus build [skip ci]" || echo "No changes to commit"
          git push origin gh-pages